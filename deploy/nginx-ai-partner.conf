# AI-Partner Nginx 站点配置
# 使用前请将 YOUR_DOMAIN 替换为真实域名，例如 example.com
# 安装示例：
#   sudo cp deploy/nginx-ai-partner.conf /etc/nginx/sites-available/ai-partner
#   sudo ln -sf /etc/nginx/sites-available/ai-partner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 申请 HTTPS：
#   sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN;

    root /var/www/ai-partner/dist;
    index index.html;

    # 前端 SPA：history 模式回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：去掉 /api 前缀，转发到本机 uvicorn（与 Vite 开发代理一致）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        # SSE 流式聊天：关闭缓冲并拉长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
